<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--post(sensitive data like password) get(insensitive data)-->
    <form action="index.php" method="post" enctype="multipart/form-data">

      <label for="Username">Username</label>
      <input type="text" id="Username" required minlength="6" maxlength="10" placeholder="spongebob12#"/><br> 
        
      <label for="password">password</label>
      <input type="password" id="password" required minlength="6" maxlength="15"> <br>

      <label for="email">email</label>
      <input type="email" id="email" placeholder="squarepants@gmail.com"> <br>
      
      <label for="phone">phone #</label>
      <input type="tel" id="phone" placeholder="98-123-456-78" pattern="[0-9]{2}-[0-9]{3}-[0-9]{3}-[0-9]{2}"><br>

      <label for="bday">birthday</label>
      <input type="date" id="bday"><br>

      <label for="quantity">quantity</label>
      <input type="number" id="quantity"  required minlength="1" maxlength="99" value="1"> <br>

      <label for="title">title:</label>

       <label for="Mr">Mr.</label>
       <input type="radio" id="Mr" value="Mr" name="title">
       <label for="Mrs">Mrs.</label>
       <input type="radio" id="Mrs" value="Mrs" name="title">
       <label for="PhD">PhD.</label>
       <input type="radio" id="PhD" value="PhD" name="title"><br> 

       <label for="Payment">Payment.</label>
       <select id="Payment">
        <option value="visa">visa</option>
        <option value="mastercard">mastercard</option>
        <option value="giftcard">giftcard</option>          
       </select><br>

       <label for="subscribe">subscribe</label>
       <input type="checkbox" id="subscribe"><br>

       <label for="comment">comment</label>
       <textarea id="comment" rows="3" cols="25"></textarea><br>

       <label for="file">file</label>
       <input type="file" id="file" accept="image/png, image/jpeg"><br>

      <input type="reset" /> <br>
      <input type="submit" />
    </form>
  </body>
</html>
